# Docker Compose for WebApiShop Development Environment
version: '3.8'

services:
  # WebApiShop API
  webapishop-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      # - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=WebApiShop216328971;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=true;
      - ConnectionStrings__DefaultConnection=Server=host.docker.internal;Database=WebApiShop216328971;Integrated Security=True;TrustServerCertificate=true;
      - ConnectionStrings__Redis=redis:6379,password=Qq123!@#QQQ
      - RedisOptions__Configuration=redis:6379,password=Qq123!@#QQQ
      - Jwt__Key=WebApiShop_SuperSecret_JWT_Key_2024!
      - Jwt__Issuer=WebApiShop
      - Jwt__Audience=WebApiShopUsers
      - Jwt__ExpiresInMinutes=60
    depends_on:
      - sqlserver
      - redis
    networks:
      - webapishop-network
    volumes:
      - ./logs:/app/logs

  # SQL Server Database
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=YourStrong@Passw0rd
      - MSSQL_PID=Express
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    networks:
      - webapishop-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    command: redis-server --requirepass Qq123!@#QQQ
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - webapishop-network

  # Redis Commander (Redis GUI)
  redis-commander:
    image: rediscommander/redis-commander:latest
    environment:
      - REDIS_HOSTS=local:redis:6379:0:Qq123!@#QQQ
    ports:
      - "8081:8081"
    depends_on:
      - redis
    networks:
      - webapishop-network

  # Kafka Broker (KRaft mode - no Zookeeper)
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - webapishop-network

  # Kafka UI - monitor at http://localhost:8082
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      - kafka
    networks:
      - webapishop-network

volumes:
  sqlserver-data:
  redis-data:
  kafka-data:


networks:
  webapishop-network:
    driver: bridge