<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="utf-8" />
    <script src="Home.js" defer></script>
    <script src="Password.js" defer></script>
    <title>דף כניסה מעוצב</title>
    
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #fdfcfb 0%, #ffeef8 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: #444;
        }

        /* מכולה מרכזית */
        .content {
            display: flex;
            flex-direction: row;
            gap: 40px;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            max-width: 900px;
            width: 90%;
            justify-content: center;
        }

        /* עיצוב הטפסים */
        .existUser, .newUser {
            display: flex;
            flex-direction: column;
            width: 300px;
            padding: 20px;
            border-radius: 15px;
            background-color: #fff;
            border: 1px solid #f9f0f6;
        }

        h3 {
            color: #d63384; /* ורוד עמוק */
            text-align: center;
            margin-bottom: 25px;
            font-size: 1.5rem;
        }

        /* עיצוב תוויות ושדות קלט */
        label {
            margin-bottom: 5px;
            font-size: 0.9rem;
            font-weight: 600;
            color: #666;
        }

        input {
            margin-bottom: 15px;
            padding: 12px;
            border: 1px solid #e1e1e1;
            border-radius: 10px;
            transition: all 0.3s ease;
            outline: none;
            background-color: #fafafa;
        }

            input:focus {
                border-color: #ff85c0;
                box-shadow: 0 0 8px rgba(255, 133, 192, 0.2);
                background-color: #fff;
            }

        /* עיצוב כפתורים */
        button {
            padding: 12px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s, background-color 0.3s;
            margin-top: 10px;
        }

        .button {
            background-color: #ff85c0; /* ורוד בהיר */
            color: white;
        }

            .button:hover {
                background-color: #f759ab;
                transform: translateY(-2px);
            }

        .check {
            background-color: #f0f0f0;
            color: #555;
            font-size: 0.85rem;
        }

            .check:hover {
                background-color: #e0e0e0;
            }

        /* פס התקדמות סיסמה */
        .progressBar {
            width: 100%;
            height: 10px;
            margin: 10px 0;
            appearance: none;
        }

            .progressBar::-webkit-progress-bar {
                background-color: #eee;
                border-radius: 10px;
            }

            .progressBar::-webkit-progress-value {
                background-color: #ff85c0;
                border-radius: 10px;
            }

        /* התאמה לניידים */
        @media (max-width: 768px) {
            .content {
                flex-direction: column;
                align-items: center;
            }
        }
    </style>
</head>
<body>

    <div class="content">
        <div class="existUser">
            <h3>משתמש רשום</h3>
            <lable for="userN">שם משתמש</lable>
            <input type="email" id="userN" required />
            <lable for="pass">סיסמא</lable>
            <input type="password" id="pass" required />
            <button onClick="login()" class="button">שליחה</button>
        </div>

        <div class="newUser">
            <h3>משתמש חדש</h3>
            <lable for="userName">שם משתמש</lable>
            <input type="email" id="userName" name="userName" required />
            <lable for="firstName">שם פרטי</lable>
            <input type="text" id="firstName" name="firstName" required />
            <lable for="lastName">שם משפחה</lable>
            <input type="text" id="lastName" name="lastName" required />
            <lable for="password">סיסמא</lable>
            <input type="password" id="password" name="password" required />
            <button onClick="checkPasswordLevel()" class="check">בדוק רמת סיסמא</button>
            <progress class="progressBar" max="100" value="0"></progress>
            <!--<div class="strength"></div>-->
            <button onClick="postResponse()" class="button">שליחה</button>
        </div>

    </div>

</body>
</html>
