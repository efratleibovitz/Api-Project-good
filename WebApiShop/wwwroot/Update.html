<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>login</title>
    <script src="Update.js" defer></script>
    <script src="Password.js" defer></script>
    
    <style>
        /* עיצוב כללי ומרכז הדף */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #fdfcfb 0%, #ffeef8 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: #444;
        }

        /* כותרת ראשית */
        h1 {
            text-align: center;
            font-size: 40px;
            color: #d63384;
            margin-bottom: 10px;
        }

        /* כרטיס הטופס המרכזי */
        .newUser {
            display: flex;
            flex-direction: column;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 400px;
            border: 1px solid #f9f0f6;
        }

        h3 {
            color: #d63384;
            text-align: center;
            margin-bottom: 25px;
            font-size: 1.5rem;
        }

        /* עיצוב תוויות (Labels) */
        label {
            margin-bottom: 5px;
            font-size: 0.9rem;
            font-weight: 600;
            color: #666;
            display: block;
        }

        /* עיצוב שדות קלט */
        input {
            width: 100%;
            box-sizing: border-box; /* מבטיח שהפדינג לא יחרוג מהרוחב */
            margin-bottom: 15px;
            padding: 12px;
            border: 1px solid #e1e1e1;
            border-radius: 10px;
            transition: all 0.3s ease;
            outline: none;
            background-color: #fafafa;
        }

            input:focus {
                border-color: #ff85c0;
                box-shadow: 0 0 8px rgba(255, 133, 192, 0.2);
                background-color: #fff;
            }

        /* עיצוב כפתורים */
        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s, background-color 0.3s;
            margin-top: 10px;
        }

        .button {
            background-color: #ff85c0;
            color: white;
            font-size: 1.1rem;
        }

            .button:hover {
                background-color: #f759ab;
                transform: translateY(-2px);
            }

        .check {
            background-color: #f0f0f0;
            color: #555;
            font-size: 0.85rem;
        }

            .check:hover {
                background-color: #e0e0e0;
            }

        /* פס התקדמות סיסמה */
        .progressBar {
            width: 100%;
            height: 10px;
            margin: 15px 0;
            appearance: none;
        }

            .progressBar::-webkit-progress-bar {
                background-color: #eee;
                border-radius: 10px;
            }

            .progressBar::-webkit-progress-value {
                background-color: #ff85c0;
                border-radius: 10px;
            }
    </style>
</head>
<body>
    <h1></h1>
    <div class="newUser">
        <h3>לעדכון פרטים:</h3>
        <lable for="userName">שם משתמש</lable>
        <input type="email" id="userName" name="userName" required />
        <lable for="firstName">שם פרטי</lable>
        <input type="text" id="firstName" name="firstName" required />
        <lable for="lastName">שם משפחה</lable>
        <input type="text" id="lastName" name="lastName" required />
        <lable for="password">סיסמא</lable>
        <input type="password" id="password" name="password" required />
        <button onClick="checkPasswordLevel()" class="check">בדוק רמת סיסמא</button>
        <progress class="progressBar" max="100" value="0"></progress>
        <!--<div class="strength"></div>-->
        <button onClick="updateResponse()" class="button">עדכן</button>
    </div>
</body>
</html>
